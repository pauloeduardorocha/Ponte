services:
  postgres:
    image: postgres:${PONTE_TEST_POSTGRES_VERSION:-17}-alpine
    environment:
      POSTGRES_DB: ${PONTE_TEST_POSTGRES_DB:?Start with npm run test:integration}
      POSTGRES_USER: church_test
      POSTGRES_PASSWORD: ${PONTE_TEST_POSTGRES_PASSWORD:?Start with npm run test:integration}
      PGDATA: /var/lib/postgresql/data
    ports:
      - '127.0.0.1::5432'
    tmpfs:
      - /var/lib/postgresql
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 5s
      retries: 30
